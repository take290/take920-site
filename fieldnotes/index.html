        <!-- 実写を追加する場合は、ここに figure 要素を挿入。 -->
        <p class="text">2026年11月、移住体験プログラムで滞在しました。海と山が近く、人の暮らしが濃い町です。印象に残ったのは、震災の話を聞かせてもらったときの、町の人たちの逞しさでした。起きたことを受け止めて、それでも日常を積み重ねてきた時間の重さがあります。「住もうか」と本気で迷ったくらい、好きな町になりました。</p>
